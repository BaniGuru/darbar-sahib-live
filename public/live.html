<!doctype html>
<html lang="pa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf0">
  <title>Live Gurbani Kirtan</title>
  <link rel="stylesheet" href="/static/live.css?v=19">
</head>
<body class="live-page">
  <main class="sync-screen">
    <div class="sync-state" aria-label="ਲਾਈਵ ਸਥਿਤੀ"><i id="liveDot"></i><span id="liveStatus" class="sr-only">ਜੋੜਿਆ ਜਾ ਰਿਹਾ ਹੈ</span></div>
    <section class="sync-content" aria-live="polite" aria-atomic="true">
      <div id="welcomeScreen" class="welcome-screen">
        <div class="welcome-artwork">
          <img id="defaultWelcomeImage" src="/static/darbar-sahib-live.png" class="welcome-image" width="2172" height="724" alt="Darbar Sahib Live">
          <div id="raagiArtwork" class="raagi-artwork" hidden>
            <img id="raagiImage" class="welcome-image" alt="Darbar Sahib kirtan" width="1983" height="793">
            <p id="currentRaagiName" class="raagi-name" lang="pa"></p>
          </div>
          <div class="artwork-meta">
            <div class="darbar-date-time" aria-label="ਦਰਬਾਰ ਸਾਹਿਬ ਦਾ ਨਾਨਕਸ਼ਾਹੀ ਤਾਰੀਖ਼ ਅਤੇ ਭਾਰਤੀ ਸਮਾਂ">
              <span id="darbarNanakshahiDate" lang="pa"></span>
              <time id="darbarIndiaTime" lang="en">--:-- --</time>
            </div>
            <div class="listener-badge" lang="en" aria-label="Current listeners">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13v-2a8 8 0 0 1 16 0v2M4 12h2v7H4a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2Zm16 0h-2v7h2a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2Z"></path></svg>
              <span><span id="listenerCount">—</span> <span id="listenerLabel">listeners</span></span>
            </div>
          </div>
        </div>
        <p id="startingSoon" class="starting-soon" lang="en" role="status" hidden>Starting soon…</p>
      </div>
      <div id="panktiGroup" class="pankti-group" hidden>
        <div class="pankti-entry">
          <p id="legacyGurmukhi" class="legacy-gurmukhi" lang="pa"></p>
          <p id="punjabi" class="punjabi" lang="pa"></p>
          <p id="english" class="english" lang="en"></p>
        </div>
      </div>
      <p id="emptyText" class="empty-text" lang="pa" hidden>ਵਾਹਿਗੁਰੂ</p>
    </section>
    <audio id="liveAudio" playsinline preload="none" hidden></audio>
  </main>
  <div class="player-dock" aria-label="ਲਾਈਵ ਕੀਰਤਨ ਪਲੇਅਰ">
    <button id="playToggle" class="player-toggle" type="button" aria-label="ਲਾਈਵ ਕੀਰਤਨ ਚਲਾਓ" aria-pressed="false" aria-busy="false" disabled>
      <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"></path></svg>
      <svg id="stopIcon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1.8"></rect><rect x="14" y="4.5" width="4.5" height="15" rx="1.8"></rect></svg>
      <span class="play-spinner" aria-hidden="true"></span>
    </button>
    <div class="local-time" aria-label="ਤੁਹਾਡਾ ਸਥਾਨਕ ਸਮਾਂ">
      <time id="currentUserTime" class="local-time-value" role="timer">--:-- --</time>
    </div>
  </div>
  <aside id="debugPanel" class="debug-panel" aria-live="polite" hidden>
    <div class="debug-heading"><span>ASR transcript</span><span id="debugStatus">connecting…</span></div>
    <p id="debugWords" lang="pa"><span id="debugFinal"></span><span id="debugPartial"></span></p>
  </aside>
  <script type="module" src="/static/live.js?v=19"></script>
</body>
</html>
